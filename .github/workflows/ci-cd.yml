name: CI/CD - Build and Push Docker Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: api
            context: ./api_service
          - name: matcher
            context: ./matcher_service
          - name: location
            context: ./location_service
          - name: simulator
            context: ./driver_simulator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/uber-rider-${{ matrix.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/uber-rider-${{ matrix.name }}:${{ github.sha }}
